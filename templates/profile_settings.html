<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - Lost & Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        .back-arrow {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #222;
            font-size: 28px;
            font-weight: 500;
        }

        .back-arrow:hover {
            color: #667eea;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 15px;
        }

        .profile-box {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .profile-header h2 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .profile-header p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-container {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .save-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .save-btn:hover {
            background: #5568d8;
        }

        .cancel-btn {
            background: #eee;
            color: #333;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .cancel-btn:hover {
            background: #ddd;
        }

        @media (max-width: 600px) {
            .container {
                width: 92%;
                margin: 25px auto;
            }

            .profile-box {
                padding: 20px;
            }

            .header h1 {
                font-size: 26px;
            }

            .button-container {
                flex-direction: column;
            }

            .save-btn,
            .cancel-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="{{ url_for('settings') }}" class="back-arrow">←</a>

        <div class="header">
            <h1>Profile Settings</h1>
            <p>Update your personal information</p>
        </div>

        <div class="profile-box">

            <div class="profile-header">
                <div class="avatar">👤</div>

                <div>
                    <h2>Profile Information</h2>
                    <p>Keep your information up to date.</p>
                </div>
            </div>

            <form method="POST">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ user.name if user else '' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ user.email if user else '' }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        value="{{ user.phone if user else '' }}"
                    >
                </div>

                <div class="form-group">
                    <label for="college">College / Organization</label>
                    <input
                        type="text"
                        id="college"
                        name="college"
                        value="{{ user.college if user else '' }}"
                    >
                </div>

                <div class="button-container">
                    <button type="submit" class="save-btn">
                        Save Changes
                    </button>

                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="history.back()"
                    >
                        Cancel
                    </button>
                </div>

            </form>

        </div>

    </div>

</body>
</html>
