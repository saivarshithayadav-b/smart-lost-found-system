<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="form-header">
            <h1>Login</h1>
            <p>Login to your Smart Lost & Found account</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label>Email or Phone Number:</label>
                <input type="text" name="email" placeholder="Enter email or phone number" required>
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="submit-button">Login</button>
        </form>

        <p class="login-register-text">Don't have an account?</p>
        <a href="{{ url_for('register') }}" class="back-button">Create Account</a>
    </div>
</body>
</html>
