<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account & Security - Lost & Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 15px;
        }

        .box {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            overflow: hidden;
        }

        .section {
            padding: 25px;
            border-bottom: 1px solid #eeeeee;
        }

        .section:last-child {
            border-bottom: none;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
        }

        .security-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .security-item:last-child {
            border-bottom: none;
        }

        .security-item h3 {
            font-size: 15px;
            margin-bottom: 5px;
        }

        .security-item p {
            color: #777;
            font-size: 13px;
        }

        .action-btn {
            padding: 9px 16px;
            border: none;
            border-radius: 7px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .save-btn,
        .cancel-btn {
            padding: 12px 22px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .save-btn {
            background: #667eea;
            color: white;
        }

        .cancel-btn {
            background: #eeeeee;
            color: #333;
        }

        @media (max-width: 600px) {
            .container {
                width: 94%;
                margin: 25px auto;
            }

            .header h1 {
                font-size: 25px;
            }

            .section {
                padding: 20px;
            }

            .security-item {
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Account & Security</h1>
            <p>Manage your account and security settings</p>
        </div>

        <div class="box">

            <div class="section">
                <h2>Change Password</h2>

                <form method="POST">

                    <div class="form-group">
                        <label for="current_password">Current Password</label>
                        <input
                            type="password"
                            id="current_password"
                            name="current_password"
                            placeholder="Enter current password">
                    </div>

                    <div class="form-group">
                        <label for="new_password">New Password</label>
                        <input
                            type="password"
                            id="new_password"
                            name="new_password"
                            placeholder="Enter new password">
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm New Password</label>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm new password">
                    </div>

                    <div class="buttons">
                        <button type="submit" class="save-btn">
                            Update Password
                        </button>

                        <button
                            type="button"
                            class="cancel-btn"
                            onclick="history.back()">
                            Cancel
                        </button>
                    </div>

                </form>
            </div>

            <div class="section">
                <h2>Security</h2>

                <div class="security-item">
                    <div>
                        <h3>Password</h3>
                        <p>Keep your password strong and secure.</p>
                    </div>

                    <button class="action-btn">
                        Change
                    </button>
                </div>

                <div class="security-item">
                    <div>
                        <h3>Login Security</h3>
                        <p>Review your account login activity.</p>
                    </div>

                    <button class="action-btn">
                        Review
                    </button>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
